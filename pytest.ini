[pytest]
# Peter AI v1.3.0 — pytest configuration
markers =
    req: marks tests that cover a specific requirement (deselect with '-m "not req"')
    slow: marks tests that are slow (deselect with '-m "not slow"')
    live: marks tests that require real API keys / network (deselect with '-m "not live"')
    docs: marks tests that validate documentation sync
    integration: marks integration tests that test multiple components together

# JUnit XML output: pass --junit-xml=junit.xml on the command line
junit_family = xunit2

# Default options
addopts =
    --tb=short
    -q

# Coverage targets (used by run_validation.py; not enforced here to keep plain pytest fast)
# Run: pytest --cov=core --cov=memory --cov=llm --cov=engine --cov-report=term-missing

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
